sonar.projectKey=MyauDev_vekst
sonar.organization=myaudev

sonar.sourceEncoding=UTF-8

# --- what to analyse ---------------------------------------------------------
# Scoped explicitly rather than left at the default ".", so that documents,
# OpenSpec artifacts and deployment manifests are not reported as source.
sonar.sources=core,classifier/src,web/src,proto
sonar.tests=core,classifier/tests,web/src

sonar.test.inclusions=\
  **/*_test.go,\
  classifier/tests/**,\
  web/src/**/*.test.ts,\
  web/src/**/*.test.tsx

# --- what to exclude ---------------------------------------------------------
# Generated code is the big one. Without these exclusions the analysis is
# dominated by protoc output that nobody wrote and nobody may edit, which buries
# every real finding and makes the coverage percentage meaningless.
sonar.exclusions=\
  core/gen/**,\
  web/src/gen/**,\
  classifier/src/vekst/**,\
  **/*.pb.go,\
  **/*_grpc.pb.go,\
  **/*_pb2.py,\
  **/*_pb2.pyi,\
  **/*_pb2_grpc.py,\
  **/*_pb2_grpc.pyi,\
  **/*_pb.ts,\
  **/node_modules/**,\
  **/.venv/**,\
  **/dist/**

# Composition roots only: main(), createRoot(), signal wiring. They read
# configuration, construct objects and hand off. There is no branching worth
# asserting that the unit tests do not already cover, and exercising them means
# spawning processes -- which the cluster does end to end. Everything with
# behaviour stays in.
sonar.coverage.exclusions=\
  **/*_test.go,\
  classifier/tests/**,\
  web/src/**/*.test.ts,\
  web/src/**/*.test.tsx,\
  web/vite.config.ts,\
  web/src/main.tsx,\
  core/cmd/**

# --- coverage ----------------------------------------------------------------
# Produced by the sonarqube job in .github/workflows/ci.yaml before the scan.
# Paths are relative to this file.
sonar.go.coverage.reportPaths=coverage.out
sonar.python.coverage.reportPaths=classifier/coverage.xml
sonar.javascript.lcov.reportPaths=web/coverage/lcov.info

# Go's own tooling is authoritative for the module layout.
sonar.go.exclusions=**/vendor/**
