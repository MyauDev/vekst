name: ci

# One workflow, parallel jobs. Every job here is a merge gate; a change that
# cannot pass them is not ready regardless of how urgent it feels.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "24"
  PYTHON_VERSION: "3.14"

jobs:
  # --- contract ------------------------------------------------------------
  buf:
    name: proto lint and breaking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      # setup_only: buf is driven explicitly below. The action's own breaking
      # step errors with "had no .proto files" when main has no baseline yet,
      # and its default pr_comment needs pull-requests: write, which this
      # workflow deliberately does not grant.
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - run: buf lint --error-format github-actions

      - name: breaking change check
        run: |
          git fetch --quiet origin main || true
          if git ls-tree -r --name-only origin/main 2>/dev/null | grep -q '\.proto$'; then
            buf breaking --error-format github-actions --against '.git#branch=origin/main'
          else
            # A first proto commit has no baseline. That is not a breaking
            # change, and treating it as an error would mean the gate could
            # never be introduced in the same change that introduces /proto.
            echo "::notice::main has no .proto files yet — no baseline to compare against"
          fi

  codegen:
    name: generated code has not drifted
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version: "${{ env.GO_VERSION }}" }
      - uses: actions/setup-node@v6
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm, cache-dependency-path: web/package-lock.json }
      - uses: astral-sh/setup-uv@v7
        with: { enable-cache: true }
      - uses: bufbuild/buf-action@v1
        with: { setup_only: true }
      - run: go install tool
      - run: npm ci
        working-directory: web
      - run: uv sync --locked
        working-directory: classifier
      - run: make gen
      # Every generator is local, so this job needs no registry and cannot fail
      # for reasons unrelated to the change under review.
      - name: fail if regenerating changed anything
        run: git diff --exit-code || { echo "::error::run 'make gen' and commit the result"; exit 1; }

  # --- languages -----------------------------------------------------------
  go:
    name: go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version: "${{ env.GO_VERSION }}", cache: true }
      - run: go vet ./...
      - run: go test -race ./...
      - uses: golang/govulncheck-action@v1
        with: { go-version-input: "${{ env.GO_VERSION }}" }

  python:
    name: python
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: classifier } }
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with: { enable-cache: true, python-version: "${{ env.PYTHON_VERSION }}" }
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run mypy .
      - run: uv run pytest -q

  web:
    name: web
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run

  # --- deployment shape ----------------------------------------------------
  manifests:
    name: kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-kubectl@v4
      - name: install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /usr/local/bin kubeconform
      - name: build and validate every overlay
        run: |
          for overlay in deploy/k8s/overlays/*/; do
            echo "::group::$overlay"
            kubectl kustomize "$overlay" | kubeconform -strict -summary -
            echo "::endgroup::"
          done

  # --- secrets -------------------------------------------------------------
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      # The gitleaks CLI is MIT. Only the gitleaks-action wrapper is
      # commercially licensed for organisation-owned repositories, which this
      # one now is. Running the binary directly is the same scan, unlicensed,
      # and pinned to a version we choose rather than a floating tag.
      - name: install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: scan git history
        run: gitleaks git --redact --no-banner .
      - name: scan working tree
        run: gitleaks dir --redact --no-banner .

  # --- images --------------------------------------------------------------
  images:
    name: build images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: core,       dockerfile: deploy/docker/Dockerfile.core,       target: runtime }
          - { name: classifier, dockerfile: deploy/docker/Dockerfile.classifier, target: "" }
          - { name: web,        dockerfile: deploy/docker/Dockerfile.web,        target: static }
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: false
          build-args: |
            VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
