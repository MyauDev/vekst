name: ci

# One workflow, parallel jobs. Every job here is a merge gate; a change that
# cannot pass them is not ready regardless of how urgent it feels.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "24"
  PYTHON_VERSION: "3.14"

jobs:
  # --- contract ------------------------------------------------------------
  buf:
    name: proto lint and breaking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: bufbuild/buf-action@v1
        with:
          lint: true
          format: false
          # Compare against main. On the first commit main has no /proto, and
          # this must pass rather than error on a missing baseline.
          breaking: true
          breaking_against: "https://github.com/${{ github.repository }}.git#branch=main"
          push: false

  codegen:
    name: generated code has not drifted
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version: "${{ env.GO_VERSION }}" }
      - uses: actions/setup-node@v6
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm, cache-dependency-path: web/package-lock.json }
      - uses: astral-sh/setup-uv@v7
        with: { enable-cache: true }
      - uses: bufbuild/buf-action@v1
        with: { setup_only: true }
      - run: go install tool
      - run: npm ci
        working-directory: web
      - run: uv sync --locked
        working-directory: classifier
      - run: make gen
      # Every generator is local, so this job needs no registry and cannot fail
      # for reasons unrelated to the change under review.
      - name: fail if regenerating changed anything
        run: git diff --exit-code || { echo "::error::run 'make gen' and commit the result"; exit 1; }

  # --- languages -----------------------------------------------------------
  go:
    name: go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version: "${{ env.GO_VERSION }}", cache: true }
      - run: go vet ./...
      - run: go test -race ./...
      - uses: golang/govulncheck-action@v1
        with: { go-version-input: "${{ env.GO_VERSION }}" }

  python:
    name: python
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: classifier } }
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with: { enable-cache: true, python-version: "${{ env.PYTHON_VERSION }}" }
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run mypy .
      - run: uv run pytest -q

  web:
    name: web
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run

  # --- deployment shape ----------------------------------------------------
  manifests:
    name: kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-kubectl@v4
      - name: install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /usr/local/bin kubeconform
      - name: build and validate every overlay
        run: |
          for overlay in deploy/k8s/overlays/*/; do
            echo "::group::$overlay"
            kubectl kustomize "$overlay" | kubeconform -strict -summary -
            echo "::endgroup::"
          done

  # --- secrets -------------------------------------------------------------
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  # --- images --------------------------------------------------------------
  images:
    name: build images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: core,       dockerfile: deploy/docker/Dockerfile.core,       target: runtime }
          - { name: classifier, dockerfile: deploy/docker/Dockerfile.classifier, target: "" }
          - { name: web,        dockerfile: deploy/docker/Dockerfile.web,        target: static }
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: false
          build-args: |
            VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
