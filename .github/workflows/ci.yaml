name: ci

# One workflow, parallel jobs. Every job here is a merge gate; a change that
# cannot pass them is not ready regardless of how urgent it feels.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "24"
  PYTHON_VERSION: "3.14"

jobs:
  # --- contract ------------------------------------------------------------
  buf:
    name: proto lint and breaking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      # setup_only: buf is driven explicitly below. The action's own breaking
      # step errors with "had no .proto files" when main has no baseline yet,
      # and its default pr_comment needs pull-requests: write, which this
      # workflow deliberately does not grant.
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - run: buf lint --error-format github-actions

      - name: breaking change check
        run: |
          git fetch --quiet origin main || true
          if git ls-tree -r --name-only origin/main 2>/dev/null | grep -q '\.proto$'; then
            buf breaking --error-format github-actions --against '.git#branch=origin/main'
          else
            # A first proto commit has no baseline. That is not a breaking
            # change, and treating it as an error would mean the gate could
            # never be introduced in the same change that introduces /proto.
            echo "::notice::main has no .proto files yet — no baseline to compare against"
          fi

  codegen:
    name: generated code has not drifted
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version: "${{ env.GO_VERSION }}" }
      - uses: actions/setup-node@v6
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm, cache-dependency-path: web/package-lock.json }
      - uses: astral-sh/setup-uv@v7
        with: { enable-cache: true }
      - uses: bufbuild/buf-action@v1
        with: { setup_only: true }
      - run: go install tool
      - run: npm ci
        working-directory: web
      - run: uv sync --locked
        working-directory: classifier
      - run: make gen
      # Every generator is local, so this job needs no registry and cannot fail
      # for reasons unrelated to the change under review.
      - name: fail if regenerating changed anything
        run: git diff --exit-code || { echo "::error::run 'make gen' and commit the result"; exit 1; }

  # --- languages -----------------------------------------------------------
  go:
    name: go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version: "${{ env.GO_VERSION }}", cache: true }
      - run: go vet ./...
      - run: go test -race ./...
      - uses: golang/govulncheck-action@v1
        with: { go-version-input: "${{ env.GO_VERSION }}" }
      # The mechanism behind design D2's one transaction entry point.
      - run: ./scripts/check-db-entry-point.sh
      # The mechanism behind add-identity design 1.1: the four RLS-exempt
      # identity tables are read only through one query file, and that file
      # never reaches outside them.
      - run: ./scripts/check-identity-queries.sh

  # --- database: migrations, roles, the RLS-exemption allowlist ------------
  database:
    name: migrations and roles
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        # The initdb user is a throwaway superuser, NOT vekst_migrator.
        # POSTGRES_USER becomes a superuser, and a superuser bypasses
        # row-level security unconditionally -- FORCE included -- so
        # provisioning vekst_migrator this way made CI prove nothing about a
        # managed Postgres, which hands out a plain owner (design D0).
        # deploy/db/provision-migrator.sql creates the real role below.
        env:
          POSTGRES_USER: ci_superuser
          POSTGRES_PASSWORD: ci_superuser
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci_superuser -d postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL_MIGRATOR: postgres://vekst_migrator:vekst_migrator@localhost:5432/vekst?sslmode=disable
      # vekst_app, for the InTx and River tests below -- they skip themselves
      # when this is unset (e.g. a developer's `go test ./...` with no
      # database running), but CI always has one.
      DATABASE_URL: postgres://vekst_app:vekst_app@localhost:5432/vekst?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version: "${{ env.GO_VERSION }}", cache: true }
      - name: install psql
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends postgresql-client

      # What the environment owes the schema before goose runs: vekst_migrator
      # as a plain, non-superuser owner of database vekst (design D0). Same
      # file the local overlay mounts into initdb, so the two cannot drift.
      - name: provision vekst_migrator (non-superuser owner)
        run: |
          psql "postgres://ci_superuser:ci_superuser@localhost:5432/postgres?sslmode=disable" \
            -v ON_ERROR_STOP=1 -q -f deploy/db/provision-migrator.sql

      # Task 8.1: up, down to zero, up again against a scratch database --
      # the cheapest way to discover a down migration was never written.
      - name: migrate up
        run: go run ./core/cmd/vekst-core migrate up
      - name: migrate down (identity)
        run: go run ./core/cmd/vekst-core migrate down
      - name: migrate down (River)
        run: go run ./core/cmd/vekst-core migrate down
      - name: migrate down (roles)
        run: go run ./core/cmd/vekst-core migrate down
      - name: migrate up again
        run: go run ./core/cmd/vekst-core migrate up

      # Task 8.2, extended by change 1.1 task 0.4: neither role that anything
      # authenticates as may bypass row-level security. vekst_app was always
      # asserted; vekst_migrator is asserted here too, because a superuser
      # owner makes FORCE ROW LEVEL SECURITY decorative and would do so
      # silently, in the one environment where the tests run (design D0).
      # This is the assertion that keeps every other RLS test honest.
      - name: role assertions
        run: |
          for role in vekst_app vekst_migrator; do
            bypassrls=$(psql "$DATABASE_URL_MIGRATOR" -tAc \
              "SELECT rolbypassrls FROM pg_roles WHERE rolname = '$role'")
            [ "$bypassrls" = "f" ] || { echo "::error::$role has BYPASSRLS"; exit 1; }

            issuper=$(psql "$DATABASE_URL_MIGRATOR" -tAc \
              "SELECT rolsuper FROM pg_roles WHERE rolname = '$role'")
            [ "$issuper" = "f" ] || { echo "::error::$role is a superuser"; exit 1; }
          done

          if psql "postgres://vekst_app:vekst_app@localhost:5432/vekst?sslmode=disable" \
              -c "CREATE TABLE role_assertion_probe (id int)" >/tmp/create.log 2>&1; then
            echo "::error::vekst_app was able to create a table"
            cat /tmp/create.log
            exit 1
          fi

      # There was a step here asserting that deploy/db/rls-exempt-tables.txt
      # equalled every table in the schema. That held only while every table was
      # goose's or River's infrastructure, and add-tenancy-and-rls ended it: the
      # four tenant tables it creates carry policies and must never appear on an
      # exemption list, because a line there asserts "no tenant's data can ever
      # land in this table". The step failed for exactly the reason it should
      # have passed.
      #
      # It is not repaired here, because the property it reached for is already
      # owned -- and owned better -- by TestRLSCoverageOfTheRealSchema in
      # core/internal/migrate, which the SonarQube job runs on every pull
      # request with DATABASE_URL_ADMIN set. That test checks RLS enabled AND
      # forced, the tenant column, a policy that actually restricts rows rather
      # than merely existing, write coverage, and the materialized-view and
      # partition cases that carry no policy of their own; task 5.5 in it also
      # fails on a stale allowlist entry. Two checks of one rule that can
      # disagree is worse than one check that cannot.

      # Tasks 4.5/4.6 and InTx's own commit/rollback behavior: real
      # transaction semantics against the now-migrated database above. These
      # tests skip themselves (not fail) when DATABASE_URL is unset, e.g. a
      # developer's plain `go test ./...`.
      - name: InTx and River tests against a live database
        run: go test ./core/internal/db/... ./core/internal/jobs/... -run 'TestInSystemTx|TestInsertTx' -v

  python:
    name: python
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: classifier } }
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with: { enable-cache: true, python-version: "${{ env.PYTHON_VERSION }}" }
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run mypy .
      - run: uv run pytest -q

  web:
    name: web
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run

  # --- deployment shape ----------------------------------------------------
  manifests:
    name: kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-kubectl@v4
      - name: install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /usr/local/bin kubeconform
      - name: build and validate every overlay
        run: |
          for overlay in deploy/k8s/overlays/*/; do
            echo "::group::$overlay"
            kubectl kustomize "$overlay" | kubeconform -strict -summary -
            echo "::endgroup::"
          done

  # --- secrets -------------------------------------------------------------
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      # The gitleaks CLI is MIT. Only the gitleaks-action wrapper is
      # commercially licensed for organisation-owned repositories, which this
      # one now is. Running the binary directly is the same scan, unlicensed,
      # and pinned to a version we choose rather than a floating tag.
      - name: install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: scan git history
        run: gitleaks git --redact --no-banner .
      - name: scan working tree
        run: gitleaks dir --redact --no-banner .
      # CODEOWNERS drifted back to placeholder text once already this
      # change (uncommitted, caught in review) -- this is the mechanism
      # that catches a repeat.
      - name: CODEOWNERS has no placeholder text
        run: ./scripts/check-codeowners.sh

  # --- static analysis -----------------------------------------------------
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    # Without this, core/internal/db, core/internal/jobs, core/internal/migrate
    # and core/migrations/00002_river.go's tests all skip themselves (no
    # DATABASE_URL) rather than fail -- so this job used to report them as
    # untested, not as failing, and nothing here caught it. Since almost all
    # of that code is new in a given change, it dominates SonarCloud's
    # new-code-coverage gate specifically, which is what actually blocks a
    # pull request -- overall coverage looked fine while new-code coverage
    # was failing underneath it.
    # Two Postgres containers, not one: core/internal/migrate's round-trip
    # test does a real `DROP ROLE vekst_app`, which Postgres refuses
    # cluster-wide as long as vekst_app holds grants in *any* database in
    # that cluster -- including the already-migrated `vekst` database the
    # other packages' tests need. One cluster can't host both without the
    # migrate test failing on every run (found the hard way while adding
    # this job; see design.md's risk table).
    services:
      postgres:
        image: postgres:16-alpine
        # The initdb user is a throwaway superuser, NOT vekst_migrator.
        # POSTGRES_USER becomes a superuser, and a superuser bypasses
        # row-level security unconditionally -- FORCE included -- so
        # provisioning vekst_migrator this way made CI prove nothing about a
        # managed Postgres, which hands out a plain owner (design D0).
        # deploy/db/provision-migrator.sql creates the real role below.
        env:
          POSTGRES_USER: ci_superuser
          POSTGRES_PASSWORD: ci_superuser
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci_superuser -d postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
      postgres-migrate:
        image: postgres:16-alpine
        # The initdb user is a throwaway superuser, NOT vekst_migrator.
        # POSTGRES_USER becomes a superuser, and a superuser bypasses
        # row-level security unconditionally -- FORCE included -- so
        # provisioning vekst_migrator this way made CI prove nothing about a
        # managed Postgres, which hands out a plain owner (design D0).
        # deploy/db/provision-migrator.sql creates the real role below.
        env:
          POSTGRES_USER: ci_superuser
          POSTGRES_PASSWORD: ci_superuser
          POSTGRES_DB: postgres
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U ci_superuser -d postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL_MIGRATOR: postgres://vekst_migrator:vekst_migrator@localhost:5432/vekst?sslmode=disable
      DATABASE_URL: postgres://vekst_app:vekst_app@localhost:5432/vekst?sslmode=disable
    steps:
      - uses: actions/checkout@v5
        with:
          # Shallow clones weaken blame data, which SonarQube uses to decide
          # what counts as new code.
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with: { go-version: "${{ env.GO_VERSION }}", cache: true }
      - uses: actions/setup-node@v6
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm, cache-dependency-path: web/package-lock.json }
      - uses: astral-sh/setup-uv@v7
        with: { enable-cache: true, python-version: "${{ env.PYTHON_VERSION }}" }

      - name: install psql
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends postgresql-client

      # What the environment owes the schema before goose runs: vekst_migrator
      # as a plain, non-superuser owner of database vekst (design D0). Same
      # file the local overlay mounts into initdb, so the two cannot drift.
      - name: provision vekst_migrator (non-superuser owner)
        run: |
          psql "postgres://ci_superuser:ci_superuser@localhost:5432/postgres?sslmode=disable" \
            -v ON_ERROR_STOP=1 -q -f deploy/db/provision-migrator.sql
      # The second cluster too -- core/internal/migrate's round trip needs its
      # own, because its real DROP ROLE vekst_app is cluster-wide.
      - name: provision vekst_migrator (migrate cluster)
        run: |
          psql "postgres://ci_superuser:ci_superuser@localhost:5433/postgres?sslmode=disable" \
            -v ON_ERROR_STOP=1 -q -f deploy/db/provision-migrator.sql

      - name: migrate up
        run: go run ./core/cmd/vekst-core migrate up

      # Coverage is produced here rather than reused from the language jobs: a
      # scan without it reports every line as untested, and a quality gate built
      # on that number is worse than no gate.
      #
      # core/internal/migrate runs separately, against postgres-migrate, with
      # -coverpkg widened to also credit core/migrations (the package its
      # tests actually exercise via goose's registered Go migration) -- then
      # both profiles are merged into the one file the scan step reads.
      #
      # It gets DATABASE_URL_ADMIN as well: its harness creates a disposable
      # database per test, and vekst_migrator deliberately cannot, holding only
      # CREATEROLE and ownership (deploy/db/provision-migrator.sql). Granting it
      # CREATEDB here would widen the contract every hosted environment has to
      # satisfy for something only the tests do, so the throwaway superuser --
      # which exists in CI and nowhere else -- does the CREATE and DROP.
      - name: go coverage
        run: |
          go test $(go list ./core/... | grep -v internal/migrate) \
            -coverprofile=coverage.out -covermode=atomic
          DATABASE_URL_MIGRATOR="postgres://vekst_migrator:vekst_migrator@localhost:5433/vekst?sslmode=disable" \
          DATABASE_URL_ADMIN="postgres://ci_superuser:ci_superuser@localhost:5433/postgres?sslmode=disable" \
            go test ./core/internal/migrate/... \
            -coverprofile=coverage.migrate.out -covermode=atomic \
            -coverpkg=./core/internal/migrate/...,./core/migrations/...
          { head -1 coverage.out; tail -n +2 coverage.out; tail -n +2 coverage.migrate.out; } > coverage.merged.out
          mv coverage.merged.out coverage.out
      - name: python coverage
        working-directory: classifier
        run: |
          uv sync --locked
          uv run pytest -q --cov=vekst_classifier --cov-report=xml:coverage.xml
      - name: web coverage
        working-directory: web
        run: |
          npm ci
          npx vitest run --coverage

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # --- images --------------------------------------------------------------
  images:
    name: build images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: core,       dockerfile: deploy/docker/Dockerfile.core,       target: runtime }
          - { name: classifier, dockerfile: deploy/docker/Dockerfile.classifier, target: "" }
          - { name: web,        dockerfile: deploy/docker/Dockerfile.web,        target: static }
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: false
          build-args: |
            VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
