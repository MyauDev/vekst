apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The base is what the application IS. An overlay changes configuration --
# image tags, replicas, limits, ingress host, credentials -- never the set of
# workloads.
#
# There is no Postgres here on purpose. The development database lives in the
# local overlay only, so no deployment overlay can inherit a database that has
# no rehearsed backup and restore procedure. Design D1 and D5.
#
# There is no object store here either, and for the same reason: MinIO lives
# in the local overlay only (add-file-upload design D5). It is also, today,
# the only place this change can run at all -- D-6 names no production host,
# so core.yaml's object-store environment reads from a Secret no environment
# but this one defines yet, and CreateImportBatch answers with a
# configuration error everywhere else until that decision is made.
#
# The migration Job IS here, unlike Postgres: every environment migrates its
# schema, so a Job that lived only in an overlay would force each overlay to
# reinvent it -- exactly the divergence this base/overlay split forbids
# (design Migration Plan).
resources:
  - core.yaml
  - classifier.yaml
  - web.yaml
  - ingress.yaml
  - migrate-job.yaml

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: vekst
