# Not the google-oidc.yaml pattern: minio.yaml's credentials are throwaway
# values for an object store that exists only on a laptop, the same as
# db-secrets.yaml's Postgres credentials -- committing them costs nothing,
# because there is no real credential behind D-6 yet for a placeholder to
# stand in for. core reads this Secret through VEKST_OBJECT_STORE_* (all
# `optional: true` in core.yaml), so an environment with no such Secret at
# all -- any environment but this one, until D-6 is answered -- still starts;
# only CreateImportBatch fails.
apiVersion: v1
kind: Secret
metadata:
  name: vekst-object-store
stringData:
  endpoint: http://minio:9000
  bucket: vekst
  region: us-east-1
  access_key_id: minioadmin
  secret_access_key: minioadmin
  # path_style is deliberately absent: core/internal/config defaults
  # VEKST_OBJECT_STORE_PATH_STYLE to true, which is what MinIO needs, so
  # there is nothing for this environment to override.
