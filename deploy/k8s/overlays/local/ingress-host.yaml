# The overlay changes the host and NOTHING else.
#
# It used to say that in a comment while restating the whole path list, and a
# strategic-merge patch replaces a list rather than merging into it. So the
# rendered local Ingress carried only the two paths written here -- and when
# `/auth` was added to the base, the local cluster silently kept serving it from
# the web container. Sign-in worked nowhere, and the manifest that broke it
# looked correct.
#
# A JSON 6902 patch addresses one field. The path routing now genuinely lives in
# the base, and an environment cannot drift from it by omission -- which is what
# the platform-foundation requirement "Routing is not redefined per environment"
# has always asked for.
#
# The host is plain "localhost", not "vekst.localhost": Google refuses to
# register a redirect URI whose host is a subdomain of localhost, exempting only
# localhost itself and localhost IPs, so no local redirect URI could be
# registered otherwise. One host for the document, /rpc and /auth is what makes
# the session cookie first-party and means no CORS header is needed. See
# add-identity design D6.
- op: add
  path: /spec/rules/0/host
  value: localhost
