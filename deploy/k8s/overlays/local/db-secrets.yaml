# Two Secrets, not two keys in one (design Q2): core mounts vekst-db-app and
# nothing else, so "migrator credentials are absent from the serving
# container" holds by construction rather than by review discipline. Both
# names are fixed in deploy/k8s/base; only the contents differ per
# environment. Here, contents are the local Postgres's dev-only credentials
# -- a hosted environment's contents (and their rotation) are the
# provisioning change's job, per Q2.
apiVersion: v1
kind: Secret
metadata:
  name: vekst-db-app
stringData:
  url: postgres://vekst_app:vekst_app@postgres:5432/vekst?sslmode=disable
---
apiVersion: v1
kind: Secret
metadata:
  name: vekst-db-migrator
stringData:
  url: postgres://vekst_migrator:vekst_migrator@postgres:5432/vekst?sslmode=disable
