apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  - postgres.yaml          # development only; never in the base
  - db-secrets.yaml        # dev-only credentials; contents differ per environment (design Q2)
  - google-oidc.yaml       # placeholders only; real values in the git-ignored google-oidc.secret.yaml
  # The provisioning contract as a ConfigMap, generated from the same file CI
  # runs, so the local cluster and CI cannot drift on what the environment
  # owes the schema before goose runs.
  - ../../../db

patches:
  # A JSON 6902 patch, not a strategic merge: merging into spec.rules would
  # replace the base's path list and drop whatever this file does not repeat.
  - path: ingress-host.yaml
    target:
      kind: Ingress
      name: vekst
  - path: core-dev.yaml
  - path: web-dev.yaml

# No resource limits locally: a laptop is not a scheduling problem, and limits
# that only exist in production are limits nobody has tested.
