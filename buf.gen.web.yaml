version: v2
# Browser-facing package only: the web app never sees the internal contract.
# Local plugin from web/package-lock.json rather than a buf remote plugin --
# the BSR rate-limits anonymous use, which would make the CI drift check fail
# for reasons unrelated to the change under review. Design D5.
plugins:
  - local: web/node_modules/.bin/protoc-gen-es
    out: web/src/gen
    opt: target=ts
