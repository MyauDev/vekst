syntax = "proto3";

package vekst.type.v1;

option go_package = "github.com/MyauDev/vekst/core/gen/vekstype/v1;vekstypev1";

// Money is shared by the browser-facing API (vekst.v1) and the classifier's
// internal contract (vekst.internal.v1), which is why it lives in its own
// package rather than either one. It represents an amount as integer minor
// units plus its currency -- never as a floating-point number, in any
// language. ARCHITECTURE.md §6, openspec design D5.
message Money {
  // ISO-4217, uppercase. "EUR", "PLN", "KZT". An unknown code is rejected by
  // the application layer against the checked-in currency exponent table --
  // never defaulted to an assumed exponent.
  string currency_code = 1;

  // Signed amount in the currency's minor units. 1234 with currency_code
  // "EUR" is 12.34 EUR. jstype = JS_STRING so this reaches TypeScript as a
  // string and never as a JS number, which cannot hold an int64 exactly.
  int64 minor_units = 2 [jstype = JS_STRING];
}
