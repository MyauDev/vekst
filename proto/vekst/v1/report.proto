syntax = "proto3";

package vekst.v1;

import "vekst/type/v1/money.proto";

option go_package = "github.com/MyauDev/vekst/core/gen/vekst/v1;vektv1";

// ReportService produces the management P&L: the table a business owner reads
// in the first minute of a month. Sections, the five computed lines, one column
// per period, and an honest account of everything the report could not include.
//
// Browser-facing, so Connect rather than the native gRPC the classifier uses.
//
// Any member may read a report, a viewer included -- reading the numbers is the
// whole reason the role exists. The handler resolves the organisation through
// the one sanctioned door, which proves membership in the same step.
service ReportService {
  rpc GetManagementPNL(GetManagementPNLRequest) returns (GetManagementPNLResponse);

  // Open one figure.
  //
  // A cell is addressed by the four things that computed it -- entity, basis,
  // period and line -- and by nothing else. The alternative is an opaque handle
  // returned with each figure and passed back, which is state the server has to
  // keep or sign, and a report whose drill-down needs server state is no longer
  // reproducible from its own inputs.
  rpc ListLineTransactions(ListLineTransactionsRequest) returns (ListLineTransactionsResponse);
}

// Which half of the business a report is computed from.
//
// ARCHITECTURE.md 5.1 calls mixing these the single most likely way this
// product prints a wrong number: an invoice and the payment that settles it are
// two rows describing one event, and a line summing both counts the money
// twice. So a report names one, every figure comes from rows of that kind, and
// the other side is returned separately as reconciliation evidence rather than
// dropped.
enum ReportBasis {
  // Never sent by a client. Proto3 cannot distinguish an unset enum from its
  // zero value, so the zero value is reserved for "nobody said", and a request
  // carrying it is refused rather than defaulted -- defaulting the basis would
  // pick which half of the business the owner is looking at, silently.
  REPORT_BASIS_UNSPECIFIED = 0;

  // Accounting documents: invoices and postings.
  REPORT_BASIS_LEDGER = 1;

  // Bank statements: payments as they cleared.
  REPORT_BASIS_BANK = 2;
}

// The width of one column.
enum ReportGranularity {
  REPORT_GRANULARITY_UNSPECIFIED = 0;
  REPORT_GRANULARITY_MONTH = 1;
  REPORT_GRANULARITY_QUARTER = 2;
  REPORT_GRANULARITY_YEAR = 3;
}

// What a report could not include. Every transaction in the range lands on
// exactly one line or in exactly one of these, and the server asserts it.
enum ReportBucketKind {
  REPORT_BUCKET_KIND_UNSPECIFIED = 0;

  // No live classification. The engine did not answer and nobody has. This is
  // the one that matters: a P&L summing only what was classified describes a
  // smaller business than the one that exists, and looks finished while doing
  // it.
  REPORT_BUCKET_KIND_UNCLASSIFIED = 1;

  // CAPEX and OUT OF P&L: classified, and deliberately on no line.
  REPORT_BUCKET_KIND_NON_PNL = 2;

  // Known to be payroll and not known to be any department's. Attributing it
  // would be a guess printed as a figure.
  REPORT_BUCKET_KIND_UNALLOCATED = 3;

  // Rows of the source kind this report is not computed from.
  REPORT_BUCKET_KIND_OTHER_BASIS = 4;
}

message GetManagementPNLRequest {
  string organization_id = 1;
  string entity_id = 2;

  // Months, YYYY-MM, and the range includes both ends. A month rather than a
  // date because a period is a closed interval on the booking date, which
  // carries no time zone -- deliberately, since a booking date has none, and a
  // timestamp here would invite one.
  string from = 3;
  string to = 4;

  ReportGranularity granularity = 5;
  ReportBasis basis = 6;
}

// One cell: an amount, and its share of revenue where that means anything.
message ReportFigure {
  vekst.type.v1.Money amount = 1;

  // A ratio and not money, which is why a double is correct here and nowhere
  // else in this file. Absent when the period has no revenue -- neither zero
  // nor infinity, because a client would render both as a fact.
  optional double percent_of_revenue = 2;
}

// One row of the table.
message ReportLine {
  // The taxonomy code: '01' for NET SALES, '91' for GM. Stable in a way a name
  // is not, which is why the computation is over codes and the name is what a
  // screen prints.
  string code = 1;

  string label = 2;

  // What the taxonomy stores for this line -- 'NET SALES - CS' -- for a reader.
  // Empty on a section. It is prose and not the arithmetic: nothing resolves
  // it, so a rename would silently produce a wrong gross margin rather than an
  // error.
  string formula = 3;

  // True for GM, NM, CM, IBT and NI. A drill-down opens the two differently: a
  // section has transactions behind it, a computed line has operands.
  bool computed = 4;

  // One figure per entry in periods, in that order.
  repeated ReportFigure by_period = 5;

  ReportFigure total = 6;
}

// One excluded total, in money, per period.
message ReportBucketLine {
  ReportBucketKind kind = 1;

  // One amount per entry in periods, in that order.
  repeated vekst.type.v1.Money by_period = 2;

  vekst.type.v1.Money total = 3;
}

// The versions the summed classifications were made under, read from those rows
// and never from the server's own configuration.
//
// Those strings are what make a March report reproduce in June, and an
// accountant will ask. Repeated rather than singular because a report summing
// rows classified under two engine versions was produced under two engine
// versions, and naming one of them is a claim about reproducibility that is not
// true. In the ordinary case each holds one value; empty means the report
// summed no classification at all.
message ReportVersions {
  repeated string taxonomy = 1;
  repeated string ruleset = 2;
  repeated string engine = 3;

  // What produced the normalised text the classifications matched on. Not
  // decoration: changing it changes what counts as a match, so a report
  // reproduces only if this is recorded beside the other three.
  repeated string normalize = 4;
}

message GetManagementPNLResponse {
  // The basis is a statement at the top of the table, not a footnote.
  ReportBasis basis = 1;
  ReportGranularity granularity = 2;

  // Echoed back. "2026-Q1" alone does not say whether January was requested.
  string from = 3;
  string to = 4;

  // ISO-4217. Every figure below is in it, converted at the rate stored on the
  // row rather than one re-derived at read time.
  string base_currency = 5;

  // The column labels, in order: '2026-03' monthly, '2026-Q1' quarterly, '2026'
  // yearly. Every period in the requested range is present, including the ones
  // with no transactions -- a month absent from a report is indistinguishable
  // from a month with no trade, and only one of those is a business fact.
  repeated string periods = 6;

  // The table, in the order it is printed: each computed line follows the
  // operands it consumes, so a reader never has to hold two figures in their
  // head to see where a third came from.
  repeated ReportLine lines = 7;

  // What the table could not include, and what makes it honest.
  repeated ReportBucketLine buckets = 8;

  ReportVersions versions = 9;

  // One per entry in `periods`, in that order.
  repeated ReconciliationLine reconciliation = 10;
}

// What kind of answer a drill-down came back with, so a screen renders a list
// of rows or a list of lines without guessing.
enum ReportAnswerKind {
  REPORT_ANSWER_KIND_UNSPECIFIED = 0;
  REPORT_ANSWER_KIND_TRANSACTIONS = 1;

  // What a computed line gives back. GM has no transactions of its own: it is
  // NET SALES minus CS, and both of those have transactions.
  REPORT_ANSWER_KIND_OPERANDS = 2;
}

message ListLineTransactionsRequest {
  string organization_id = 1;
  string entity_id = 2;

  // The same four fields the report was produced from. They have to match, or
  // the rows returned are not the rows the figure was summed from -- which is
  // the one failure this endpoint exists to make impossible.
  ReportBasis basis = 3;
  ReportGranularity granularity = 4;
  string from = 5;
  string to = 6;

  // One of the labels in the report's `periods`.
  string period = 7;

  // A line's code ('01', '91') or a bucket's name ('unclassified',
  // 'non_pnl', 'unallocated', 'other_basis'). The two vocabularies are closed
  // and disjoint, so no prefix is needed to tell them apart.
  string line = 8;

  // From a previous response's next_cursor. Empty is the first page.
  string cursor = 9;
  int32 limit = 10;
}

// One transaction behind a figure.
message DrillTransaction {
  string id = 1;

  // YYYY-MM-DD.
  string booked_on = 2;

  // Where it came from. The batch says which file and the line says where in
  // it, and the pair is the row's provenance -- either alone is half an answer.
  // A customer checking a figure has that file open, and a drill-down that
  // cannot point at the line is asking them to match on amount and date and
  // hope.
  string batch_id = 3;
  int32 line_no = 4;

  // The grain: 0 with no document_ref for a bank payment, 1..n for the
  // postings of one ledger document.
  int32 posting_no = 5;
  string document_ref = 6;

  // What the source said, and the conversion into the organisation's base
  // currency. base_amount is absent when the row needed no conversion: "no
  // conversion happened" is a different claim from "converted at a rate of
  // one".
  vekst.type.v1.Money amount = 7;
  vekst.type.v1.Money base_amount = 8;

  string counterparty_raw = 9;
  string description = 10;

  // КНП, Typ operacji, a 1C account code. Empty when the source carried none.
  string regulated_code = 11;

  // ledger | bank
  string source_kind = 12;

  // The live classification. Empty on a row in one of the exclusion buckets --
  // which is the fact that put it there, not a missing value.
  string category_code = 13;
  string category_name = 14;

  // Why this row is on this line. L0 memory, L0.5 a regulated code, L1 a rule,
  // human a person -- with the evidence beside it. "Because a Belarusian
  // country rule matched this wording" and "because you told us in March" are
  // different claims about the same figure, and a reviewer trusts them
  // differently.
  //
  // matched_rule_priority is deliberately not here. It is an internal ordering
  // number, it means nothing to a reader, and returning it invites a client to
  // reason about rule order it has no business knowing.
  string engine_layer = 15;
  string evidence = 16;

  // A probability and not money, which is why a double is right here. Absent on
  // an unclassified row.
  optional double confidence = 17;

  // Set exactly when a person decided.
  string decided_by = 18;
}

// One line a computed line is made of.
message ReportOperand {
  string code = 1;
  string label = 2;

  // Whether the formula takes this operand away. How the line reads on the
  // page, not how the arithmetic runs: a cost is already negative in the store,
  // so a "minus" there is an addition here.
  bool subtracted = 3;
}

message ListLineTransactionsResponse {
  ReportAnswerKind kind = 1;

  // Set when kind is TRANSACTIONS.
  repeated DrillTransaction transactions = 2;

  // Set when kind is OPERANDS, each openable in turn.
  repeated ReportOperand operands = 3;

  // The whole cell, not this page. A reader has to know whether what they are
  // looking at is the answer or the start of it -- and this total is what the
  // figure on the report should equal.
  int32 row_count = 4;
  vekst.type.v1.Money total = 5;

  // Empty when the page just returned is the last one.
  string next_cursor = 6;
}

// The strip at the foot of the table, for one period.
//
//   opening + in - out - transfers = closing
//
// `balances` is that identity, checked rather than asserted: the three
// movements come from one aggregation and the two balances from another, so a
// row dropped or double-counted by either breaks it. When it does not hold the
// report says so rather than printing five numbers that do not add up.
message ReconciliationLine {
  string period = 1;

  vekst.type.v1.Money opening = 2;

  // Positive magnitudes, because that is how they read on a page. The store's
  // signs are what separates them.
  vekst.type.v1.Money in = 3;
  vekst.type.v1.Money out = 4;

  // The organisation moving its own money. Counted apart from in and out,
  // because calling it revenue in one account and an expense in another is how
  // a business appears to trade with itself. Both legs of a pair inside one
  // entity net to zero -- which is why the count is here too: "0 across 4 rows"
  // and "0 across none" are different facts.
  vekst.type.v1.Money transfers = 5;
  int32 transfer_row_count = 6;

  vekst.type.v1.Money closing = 7;

  bool balances = 8;

  // True while opening and closing are computed from the rows rather than read
  // from what the statement itself declared -- which nothing stores yet. The
  // identity then checks this system against itself and not against the bank,
  // and a client that renders it as "reconciled with your bank" would be
  // claiming more than it can.
  bool derived = 9;
}
